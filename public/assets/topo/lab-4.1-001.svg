<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 200" width="540" height="200" style="background:#131c2e;font-family:ui-sans-serif,system-ui,sans-serif;">
  <!-- Inside host 1 -->
  <rect x="10" y="50" width="80" height="40" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <text x="50" y="67" text-anchor="middle" fill="#94a3b8" font-size="10" font-weight="600">PC1</text>
  <text x="50" y="82" text-anchor="middle" fill="#64748b" font-size="8">192.168.1.10</text>
  <!-- Inside host 2 -->
  <rect x="10" y="110" width="80" height="40" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <text x="50" y="127" text-anchor="middle" fill="#94a3b8" font-size="10" font-weight="600">PC2</text>
  <text x="50" y="142" text-anchor="middle" fill="#64748b" font-size="8">192.168.1.11</text>
  <!-- Links to router G0/0 -->
  <line x1="90" y1="70" x2="155" y2="100" stroke="#334155" stroke-width="1.5"/>
  <line x1="90" y1="130" x2="155" y2="100" stroke="#334155" stroke-width="1.5"/>
  <!-- Inside label -->
  <rect x="5" y="20" width="95" height="18" rx="3" fill="#1e3a5f" stroke="#3b82f6" stroke-width="1"/>
  <text x="52" y="33" text-anchor="middle" fill="#3b82f6" font-size="9" font-weight="700">INSIDE</text>
  <!-- NAT Router -->
  <rect x="155" y="55" width="140" height="90" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
  <text x="225" y="82" text-anchor="middle" fill="#e2e8f0" font-size="12" font-weight="700">R1 (NAT)</text>
  <text x="225" y="98" text-anchor="middle" fill="#64748b" font-size="8">G0/0 inside</text>
  <text x="225" y="110" text-anchor="middle" fill="#64748b" font-size="8">192.168.1.1/24</text>
  <text x="225" y="124" text-anchor="middle" fill="#64748b" font-size="8">G0/1 outside</text>
  <text x="225" y="136" text-anchor="middle" fill="#64748b" font-size="8">203.0.113.2/30</text>
  <!-- NAT badge -->
  <rect x="168" y="142" width="114" height="16" rx="3" fill="#451a03" stroke="#f59e0b" stroke-width="1"/>
  <text x="225" y="154" text-anchor="middle" fill="#f59e0b" font-size="9" font-weight="600">PAT overload</text>
  <!-- Link Router - ISP -->
  <line x1="295" y1="100" x2="360" y2="100" stroke="#334155" stroke-width="1.5"/>
  <text x="327" y="93" text-anchor="middle" fill="#475569" font-size="8">203.0.113.0/30</text>
  <!-- ISP -->
  <rect x="360" y="70" width="85" height="60" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <text x="402" y="97" text-anchor="middle" fill="#94a3b8" font-size="11" font-weight="600">ISP</text>
  <text x="402" y="113" text-anchor="middle" fill="#64748b" font-size="8">203.0.113.1</text>
  <!-- Link ISP - Internet -->
  <line x1="445" y1="100" x2="495" y2="100" stroke="#334155" stroke-width="1.5"/>
  <!-- Internet cloud -->
  <ellipse cx="510" cy="100" rx="30" ry="22" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <text x="510" y="97" text-anchor="middle" fill="#94a3b8" font-size="9" font-weight="600">NET</text>
  <text x="510" y="109" text-anchor="middle" fill="#64748b" font-size="8">8.8.8.8</text>
  <!-- OUTSIDE label -->
  <rect x="440" y="20" width="95" height="18" rx="3" fill="#1a2e1e" stroke="#22c55e" stroke-width="1"/>
  <text x="487" y="33" text-anchor="middle" fill="#22c55e" font-size="9" font-weight="700">OUTSIDE</text>
  <!-- Translated arrow -->
  <text x="225" y="185" text-anchor="middle" fill="#f59e0b" font-size="9">192.168.1.x → 203.0.113.2:port# (PAT)</text>
</svg>
