<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 200" width="500" height="200" style="background:#131c2e;font-family:ui-sans-serif,system-ui,sans-serif;">
  <!-- PC -->
  <rect x="20" y="70" width="80" height="50" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <text x="60" y="91" text-anchor="middle" fill="#94a3b8" font-size="11" font-weight="600">PC</text>
  <text x="60" y="107" text-anchor="middle" fill="#64748b" font-size="9">192.168.1.2/24</text>
  <rect x="35" y="120" width="50" height="6" rx="2" fill="#334155"/>
  <!-- Link PC - Router -->
  <line x1="100" y1="95" x2="160" y2="95" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="4,2"/>
  <text x="130" y="88" text-anchor="middle" fill="#3b82f6" font-size="8">G0/0</text>
  <!-- Router -->
  <rect x="160" y="55" width="120" height="80" rx="6" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
  <text x="220" y="80" text-anchor="middle" fill="#e2e8f0" font-size="12" font-weight="700">R1</text>
  <text x="220" y="96" text-anchor="middle" fill="#64748b" font-size="9">Router</text>
  <text x="220" y="112" text-anchor="middle" fill="#64748b" font-size="8">G0/0 · G0/1</text>
  <text x="220" y="124" text-anchor="middle" fill="#64748b" font-size="8">G0/2 (IPv6)</text>
  <!-- Link Router - ISP -->
  <line x1="280" y1="95" x2="360" y2="95" stroke="#334155" stroke-width="1.5"/>
  <text x="320" y="88" text-anchor="middle" fill="#475569" font-size="8">G0/1</text>
  <!-- ISP Cloud -->
  <ellipse cx="410" cy="95" rx="60" ry="30" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <text x="410" y="91" text-anchor="middle" fill="#94a3b8" font-size="11" font-weight="600">ISP</text>
  <text x="410" y="107" text-anchor="middle" fill="#64748b" font-size="9">203.0.113.1/30</text>
  <!-- IPv6 hint -->
  <text x="250" y="165" text-anchor="middle" fill="#475569" font-size="9">G0/2: 2001:db8:1::1/64 (IPv6 loopback)</text>
  <!-- Legend -->
  <line x1="20" y1="185" x2="45" y2="185" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="4,2"/>
  <text x="50" y="189" fill="#64748b" font-size="9">Inside LAN</text>
  <line x1="130" y1="185" x2="155" y2="185" stroke="#334155" stroke-width="1.5"/>
  <text x="160" y="189" fill="#64748b" font-size="9">Uplink</text>
</svg>
