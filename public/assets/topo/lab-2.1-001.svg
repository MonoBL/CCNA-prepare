<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 220" width="520" height="220" style="background:#131c2e;font-family:ui-sans-serif,system-ui,sans-serif;">
  <!-- PC1 -->
  <rect x="20" y="80" width="75" height="45" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <text x="57" y="99" text-anchor="middle" fill="#94a3b8" font-size="11" font-weight="600">PC1</text>
  <text x="57" y="113" text-anchor="middle" fill="#64748b" font-size="8">VLAN 10</text>
  <rect x="30" y="125" width="55" height="5" rx="2" fill="#334155"/>
  <!-- Link PC1 - SW1 -->
  <line x1="95" y1="102" x2="155" y2="102" stroke="#22c55e" stroke-width="1.5"/>
  <text x="125" y="95" text-anchor="middle" fill="#22c55e" font-size="8">Fa0/1 access</text>
  <!-- SW1 -->
  <rect x="155" y="60" width="110" height="85" rx="6" fill="#1e293b" stroke="#22c55e" stroke-width="2"/>
  <text x="210" y="88" text-anchor="middle" fill="#e2e8f0" font-size="12" font-weight="700">SW1</text>
  <text x="210" y="103" text-anchor="middle" fill="#64748b" font-size="9">Layer 2 Switch</text>
  <text x="210" y="117" text-anchor="middle" fill="#64748b" font-size="8">VLAN 10 DATA</text>
  <text x="210" y="129" text-anchor="middle" fill="#64748b" font-size="8">VLAN 20 SALES</text>
  <!-- Trunk link SW1 - SW2 -->
  <line x1="265" y1="102" x2="335" y2="102" stroke="#f59e0b" stroke-width="2.5"/>
  <text x="300" y="92" text-anchor="middle" fill="#f59e0b" font-size="8" font-weight="600">802.1Q TRUNK</text>
  <text x="300" y="116" text-anchor="middle" fill="#f59e0b" font-size="8">G0/1 ←→ G0/1</text>
  <!-- SW2 -->
  <rect x="335" y="60" width="110" height="85" rx="6" fill="#1e293b" stroke="#22c55e" stroke-width="2"/>
  <text x="390" y="88" text-anchor="middle" fill="#e2e8f0" font-size="12" font-weight="700">SW2</text>
  <text x="390" y="103" text-anchor="middle" fill="#64748b" font-size="9">Layer 2 Switch</text>
  <text x="390" y="117" text-anchor="middle" fill="#64748b" font-size="8">VLAN 10 DATA</text>
  <text x="390" y="129" text-anchor="middle" fill="#64748b" font-size="8">VLAN 20 SALES</text>
  <!-- Link SW2 - PC2 -->
  <line x1="445" y1="102" x2="500" y2="102" stroke="#a855f7" stroke-width="1.5"/>
  <text x="473" y="95" text-anchor="middle" fill="#a855f7" font-size="8">Fa0/1 access</text>
  <!-- PC2 -->
  <rect x="425" y="80" width="75" height="45" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <text x="462" y="99" text-anchor="middle" fill="#94a3b8" font-size="11" font-weight="600">PC2</text>
  <text x="462" y="113" text-anchor="middle" fill="#64748b" font-size="8">VLAN 20</text>
  <rect x="435" y="125" width="55" height="5" rx="2" fill="#334155"/>
  <!-- Legend -->
  <line x1="20" y1="200" x2="45" y2="200" stroke="#22c55e" stroke-width="1.5"/>
  <text x="50" y="204" fill="#64748b" font-size="9">Access port</text>
  <line x1="130" y1="200" x2="155" y2="200" stroke="#f59e0b" stroke-width="2.5"/>
  <text x="160" y="204" fill="#64748b" font-size="9">802.1Q trunk (all VLANs)</text>
</svg>
